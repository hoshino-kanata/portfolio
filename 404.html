<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>

{% include menu.html %}

<div class="frame-scroll-zone" id="stickyContainer" style="height: auto; margin-top: 0;">
  <div class="frame-moving-body" style="position: relative; padding: 150px 0;">
    <section class="about">
      <div class="styled-card" style="text-align: center; padding: 80px 4vw;">
        
        <span class="page-sub-title">Not Found</span>
        <h1 class="page-main-title" style="font-size: 6rem; margin-bottom: 30px;">404</h1>
        
        <p class="poetic-desc">
          おや……？<br>
          ここは準備中のようです💭<br>
        </p>

        <div style="margin-top: 40px;">
          <a href="{{ site.baseurl }}" class="view-more-btn">トップページへ戻る ↗</a>
        </div>
        
      </div>
    </section>
  </div>
</div>

{% include footer.html %}

<script>
(function() {
    const menuOpenBtn = document.querySelector('.js-menu-open');
    const menuCloseBtn = document.getElementById('menuClose');
    const menuWindow = document.getElementById('menuWindow');

    if (menuOpenBtn && menuCloseBtn && menuWindow) {
        // メニューを開く
        menuOpenBtn.addEventListener('click', function() {
            menuWindow.classList.add('is-open');
        });

        // メニューを閉じる
        menuCloseBtn.addEventListener('click', function() {
            menuWindow.classList.remove('is-open');
        });
    }
})();
</script>

</body>
</html>
